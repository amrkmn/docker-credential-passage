name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        include:
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          NAME="docker-credential-passage-${{ matrix.goos }}-${{ matrix.goarch }}"

          go build -ldflags="-s -w -X main.Version=${VERSION#v}" \
            -o "bin/${NAME}" passage/cmd/main.go

          cd bin
          
          # Create archive
          ARCHIVE="${NAME}.tar.gz"
          tar -czf "${ARCHIVE}" "${NAME}"
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bin/*.tar.gz
            bin/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
